services:
  postgres:
    image: postgres:16-alpine
    container_name: egov_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: egov_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - egov_network

  redis:
    image: redis:7-alpine
    container_name: egov_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass egov_redis_password
    networks:
      - egov_network

  adminer:
    image: adminer:latest
    container_name: egov_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    networks:
      - egov_network

volumes:
  postgres_data:
  redis_data:

networks:
  egov_network:
    driver: bridge